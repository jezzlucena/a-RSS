version: '3.8'

# Dev services. Run api/web locally with hot reload; this brings up Mongo + MinIO only.

services:
  mongo:
    image: mongo:7
    container_name: arss-mongo
    volumes:
      - arss-mongo-data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: arss
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/arss --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: arss-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arss-minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  arss-mongo-data:
  arss-minio-data:
