services:
  mongo:
    image: mongo:7
    container_name: arss-mongo
    command: ["mongod", "--port", "27020"]
    volumes:
      - arss-mongo-data:/data/db
    ports:
      - "27020:27020"
    environment:
      MONGO_INITDB_DATABASE: arss
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27020/arss --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dev:
    image: node:20-bookworm-slim
    container_name: arss-dev
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        corepack enable && \
        corepack prepare pnpm@9.15.0 --activate && \
        pnpm install --frozen-lockfile && \
        pnpm -r --parallel run dev
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27020/arss
      - LADDER_URL=http://ladder:8190
    volumes:
      - .:/app
      - arss-dev-node-modules:/app/node_modules
    ports:
      - "8088:5173"  # web (vite)
      - "5088:4000"  # api (express)
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      ladder:
        condition: service_started
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: arss-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arss-minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  ladder:
    image: ghcr.io/everywall/ladder:latest
    container_name: ladder
    #command: sh -c ./ladder
    environment:
      - PORT=8190
      - RULESET=/app/ruleset.yaml
      #- ALLOWED_DOMAINS=example.com,example.org
      #- ALLOWED_DOMAINS_RULESET=false
      #- EXPOSE_RULESET=true
      #- PREFORK=false
      #- DISABLE_FORM=false
      #- FORM_PATH=/app/form.html
      #- X_FORWARDED_FOR=66.249.66.1
      #- USER_AGENT=Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
      #- USERPASS=foo:bar
      - LOG_URLS=true
      #- GODEBUG=netdns=go
      - FLARESOLVERR_HOST=http://flaresolverr:8191
    ports:
      - "8190:8190"
    volumes:
      - ./ruleset.yaml:/app/ruleset.yaml
      - ./handlers/form.html:/app/form.html
    restart: unless-stopped
  
  # Optional FlareSolverr service for Cloudflare bypass
  # Uncomment the following lines to enable FlareSolverr
  flaresolverr:
   image: ghcr.io/flaresolverr/flaresolverr:latest
   container_name: flaresolverr
   restart: unless-stopped
   environment:
     - LOG_LEVEL=info
     - LOG_HTML=false
     - CAPTCHA_SOLVER=none
     - TZ=UTC
   ports:
     - "8191:8191"

volumes:
  arss-mongo-data:
  arss-minio-data:
  arss-dev-node-modules:
