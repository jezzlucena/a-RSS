# XcodeGen spec — the single source of truth for the iOS project. `aRSS.xcodeproj` is
# generated (and gitignored); run `ios/scripts/generate.sh` after editing this file.
name: aRSS
options:
  bundleIdPrefix: com.arss
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release

# Build-time configuration lives in xcconfig files so it can be overridden per developer:
# Defaults.xcconfig (checked in) #includes the gitignored Local.xcconfig last. Don't put
# these keys under `settings:` — Xcode's project/target settings would override the xcconfig.
configFiles:
  Debug: Defaults.xcconfig
  Release: Defaults.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Views, stores and services are main-actor by default; networking types opt out with
    # `nonisolated` so decoding can run inside the APIClient actor.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0

targets:
  aRSS:
    type: application
    platform: iOS
    sources:
      - path: aRSS
    info:
      # Generated by XcodeGen from `properties`; the file itself is gitignored.
      path: aRSS/Info.plist
      properties:
        CFBundleDisplayName: a-RSS
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Docker dev stack serves the API over plain http on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.a-rss.magic
            CFBundleURLSchemes: [arss]
          - CFBundleURLName: app.a-rss.google
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        ARSS_API_BASE_URL: $(ARSS_API_BASE_URL)
        GIDClientID: $(GOOGLE_CLIENT_ID)
    entitlements:
      path: aRSS/aRSS.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arss.app
        # ARSS_API_BASE_URL, GOOGLE_CLIENT_ID, GOOGLE_REVERSED_CLIENT_ID: see Defaults.xcconfig.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"aRSS/Preview Content\""

  aRSSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: aRSSTests
    dependencies:
      - target: aRSS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arss.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # End-to-end smoke test against a running API (skips itself when SMOKE_EMAIL is unset).
  # Run: TEST_RUNNER_SMOKE_EMAIL=… TEST_RUNNER_SMOKE_PASSWORD=… xcodebuild test -only-testing:aRSSUITests …
  aRSSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: aRSSUITests
    dependencies:
      - target: aRSS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arss.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: aRSS
        # XCTestCase subclasses must stay nonisolated (XCTest's initializers are).
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  aRSS:
    build:
      targets:
        aRSS: all
        aRSSTests: [test]
        aRSSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [aRSSTests, aRSSUITests]
