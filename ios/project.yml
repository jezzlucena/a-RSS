name: aRSS
options:
  bundleIdPrefix: com.arss
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  aRSS:
    type: application
    platform: iOS
    sources:
      - path: aRSS
    info:
      path: aRSS/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.a-rss.universal
            CFBundleURLSchemes: [arss]
          - CFBundleURLName: app.a-rss.google
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        ARSS_API_BASE_URL: $(ARSS_API_BASE_URL)
        GIDClientID: $(GOOGLE_CLIENT_ID)
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arss.app
        CODE_SIGN_ENTITLEMENTS: aRSS/aRSS.entitlements
        ARSS_API_BASE_URL: "http://localhost:4000/api/v1"
        GOOGLE_CLIENT_ID: ""
        GOOGLE_REVERSED_CLIENT_ID: ""
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"aRSS/Preview Content\""

  aRSSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: aRSSTests
    dependencies:
      - target: aRSS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arss.app.tests
