<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1EA" />
    <link id="favicon-ico" rel="icon" href="/favicon.ico" sizes="32x32" />
    <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- iOS Safari home-screen/bookmark icon. Must be an opaque, square-cornered PNG:
         iOS applies its own corner mask and renders transparency as black. Served at
         the conventional root path too, since Safari requests /apple-touch-icon.png
         directly when it ignores the <link>. Deliberately not theme-swapped — the icon
         is captured once when the bookmark is made. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>a-RSS</title>
    <!-- Apply the saved theme before paint to avoid a light/dark flash, and set the
         mobile browser chrome color (theme-color) and favicon to match. Kept in sync
         with stores/theme.ts's `apply()`, which handles the same swap after boot
         (e.g. when the user toggles theme from the navbar). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('arss-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#171510' : '#F4F1EA');
          if (dark) {
            var ico = document.getElementById('favicon-ico');
            var svg = document.getElementById('favicon-svg');
            if (ico) ico.setAttribute('href', '/favicon_dark.ico');
            if (svg) svg.setAttribute('href', '/logo_dark.svg');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
